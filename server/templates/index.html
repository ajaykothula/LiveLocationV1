<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location V1</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

.header {
    padding: 14px 18px;
    background: #1f2937;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.info {
    margin-top: 6px;
    font-size: 13px;
    color: #cbd5e1;
}

.live {
    color: #22c55e;
    font-weight: bold;
}

.waiting {
    color: #f59e0b;
    font-weight: bold;
}

#map {
    height: calc(100vh - 78px);
    width: 100%;
}
</style>
</head>

<body>

<div class="header">

    <div class="title">
        📍 Live Location V1
    </div>

    <div id="info" class="info waiting">
        Waiting for location...
    </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
    [20.5937, 78.9629],
    5
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

let marker = null;
let firstLocation = true;

let lastLatitude = null;
let lastLongitude = null;
let lastRecordedAt = null;


/*
    Get latest location from server
*/
async function updateLocation() {

    try {

        const response = await fetch(
            "/api/latest?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const data = await response.json();

        console.log("Latest location:", data);


        /*
            No location yet
        */
        if (
            data.location === null ||
            data.latitude === null ||
            data.latitude === undefined ||
            data.longitude === null ||
            data.longitude === undefined
        ) {

            document.getElementById("info").innerHTML =
                "Waiting for shared location...";

            return;
        }


        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);


        if (
            !Number.isFinite(latitude) ||
            !Number.isFinite(longitude)
        ) {

            console.log("Invalid coordinates");

            return;
        }


        const position = [
            latitude,
            longitude
        ];


        /*
            Create marker first time
        */
        if (marker === null) {

            marker = L.marker(position)
                .addTo(map);

            marker.bindPopup(
                "📍 Live Location<br>" +
                "Device: " +
                data.device_id
            );

        }

        /*
            Move marker to newest location
        */
        else {

            marker.setLatLng(position);

        }


        /*
            Center map ONLY the first time.
            This prevents the map from jumping every 2 seconds.
        */
        if (firstLocation) {

            map.setView(
                position,
                17
            );

            firstLocation = false;
        }


        /*
            Update marker popup
        */
        marker.setPopupContent(
            "📍 Live Location<br>" +
            "Device: " +
            data.device_id +
            "<br>Accuracy: " +
            (data.accuracy ?? "N/A") +
            " m" +
            "<br>Updated: " +
            data.recorded_at
        );


        /*
            Show live information
        */
        document.getElementById("info").className =
            "info live";

        document.getElementById("info").innerHTML =
            "🟢 LIVE &nbsp; | &nbsp; " +
            "Device: " +
            data.device_id +
            " &nbsp; | &nbsp; " +
            "Accuracy: " +
            (data.accuracy ?? "N/A") +
            " m" +
            " &nbsp; | &nbsp; " +
            "Updated: " +
            data.recorded_at;


        /*
            Remember last location
        */
        lastLatitude = latitude;
        lastLongitude = longitude;
        lastRecordedAt = data.recorded_at;

    }

    catch (error) {

        console.error(
            "Location update error:",
            error
        );

        document.getElementById("info").className =
            "info waiting";

        document.getElementById("info").innerHTML =
            "⚠️ Waiting for server...";
    }
}


/*
    Initial update
*/
updateLocation();


/*
    Refresh automatically every 2 seconds
*/
setInterval(
    updateLocation,
    2000
);

</script>

</body>
</html>
